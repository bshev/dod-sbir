<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DoD SBIR/STTR Topics</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; font-size: 14px; background: #f4f5f7; color: #1a1a2e; }

  /* Layout */
  header { background: #1a1a2e; color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: .03em; }
  #count { font-size: 12px; color: #aab; margin-left: auto; }

  .shell { display: flex; height: calc(100vh - 45px); overflow: hidden; }

  /* Sidebar */
  #sidebar { width: 260px; min-width: 260px; background: #fff; border-right: 1px solid #dde; display: flex; flex-direction: column; padding: 12px; gap: 8px; overflow-y: auto; }
  #sidebar label { font-size: 11px; font-weight: 600; color: #667; text-transform: uppercase; letter-spacing: .06em; }
  #sidebar input, #sidebar select { width: 100%; padding: 6px 8px; border: 1px solid #dde; border-radius: 4px; font-size: 13px; background: #f9f9fb; }
  #sidebar input:focus, #sidebar select:focus { outline: none; border-color: #4a7cff; }
  #clear-btn { margin-top: 4px; padding: 6px; border: 1px solid #dde; border-radius: 4px; background: #f4f5f7; cursor: pointer; font-size: 12px; }
  #clear-btn:hover { background: #e8e9ec; }

  /* Topic list */
  #list-pane { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .topic-card { background: #fff; border: 1px solid #dde; border-radius: 6px; padding: 10px 14px; cursor: pointer; transition: border-color .15s; }
  .topic-card:hover { border-color: #4a7cff; }
  .topic-card.selected { border-color: #4a7cff; background: #f0f4ff; }
  .topic-card.compare-selected { border-color: #f59e0b; background: #fffbeb; }
  .card-code { font-size: 11px; font-weight: 700; color: #4a7cff; letter-spacing: .04em; }
  .card-title { font-size: 13px; font-weight: 500; margin: 2px 0; }
  .card-meta { font-size: 11px; color: #778; }
  .card-actions { margin-top: 6px; display: flex; gap: 6px; }
  .card-actions button { font-size: 11px; padding: 3px 8px; border-radius: 3px; border: 1px solid #dde; background: #f4f5f7; cursor: pointer; }
  .card-actions button:hover { background: #e4e5e8; }
  .card-actions .cmp-btn { border-color: #f59e0b; color: #b45309; }
  .card-actions .cmp-btn:hover { background: #fef3c7; }

  /* Detail pane */
  #detail-pane { width: 420px; min-width: 320px; background: #fff; border-left: 1px solid #dde; overflow-y: auto; padding: 16px; display: none; flex-direction: column; gap: 12px; }
  #detail-pane.open { display: flex; }
  #detail-pane h2 { font-size: 15px; font-weight: 600; }
  #detail-pane .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
  #detail-pane .meta-item label { font-size: 10px; font-weight: 700; color: #667; text-transform: uppercase; letter-spacing: .05em; display: block; }
  #detail-pane .meta-item span { font-size: 13px; }
  .section-title { font-size: 11px; font-weight: 700; color: #667; text-transform: uppercase; letter-spacing: .05em; border-top: 1px solid #eee; padding-top: 10px; }
  .section-body { font-size: 13px; line-height: 1.6; color: #333; white-space: pre-wrap; }
  #detail-close { align-self: flex-end; font-size: 11px; padding: 4px 10px; border: 1px solid #dde; border-radius: 4px; background: #f4f5f7; cursor: pointer; }

  /* Compare pane */
  #compare-pane { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; align-items: center; justify-content: center; }
  #compare-pane.open { display: flex; }
  #compare-inner { background: #fff; border-radius: 8px; width: 92vw; max-width: 1200px; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; }
  #compare-header { padding: 12px 16px; border-bottom: 1px solid #dde; display: flex; align-items: center; }
  #compare-header h2 { font-size: 14px; font-weight: 600; flex: 1; }
  #compare-header button { font-size: 12px; padding: 4px 10px; border: 1px solid #dde; border-radius: 4px; background: #f4f5f7; cursor: pointer; }
  #compare-body { flex: 1; overflow-y: auto; display: flex; gap: 0; }
  .compare-col { flex: 1; padding: 16px; border-right: 1px solid #eee; overflow-y: auto; }
  .compare-col:last-child { border-right: none; }
  .compare-col h3 { font-size: 13px; font-weight: 600; color: #4a7cff; margin-bottom: 8px; }
  .compare-col .section-title { font-size: 10px; }
  .compare-col .section-body { font-size: 12px; }

  .empty { color: #aab; font-size: 13px; padding: 20px; text-align: center; }
  #spinner { display: none; color: #aab; font-size: 13px; padding: 20px; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>DoD SBIR/STTR Open Topics</h1>
  <span id="count"></span>
</header>

<div class="shell">
  <!-- Sidebar filters -->
  <aside id="sidebar">
    <label>Search</label>
    <input id="q" type="search" placeholder="code, title, keyword…">

    <label>Component</label>
    <select id="filter-component">
      <option value="">All</option>
      {% for c in filters.components %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
    </select>

    <label>Status</label>
    <select id="filter-status">
      <option value="">All</option>
      {% for s in filters.statuses %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
    </select>

    <label>Program</label>
    <select id="filter-program">
      <option value="">All</option>
      {% for p in filters.programs %}<option value="{{ p }}">{{ p }}</option>{% endfor %}
    </select>

    <button id="clear-btn">Clear filters</button>

    <div style="margin-top:8px; font-size:11px; color:#aab;">
      <strong>Compare:</strong> select up to 3 topics using the ⊕ button, then click Compare.
    </div>
    <button id="compare-btn" style="display:none; background:#fef3c7; border-color:#f59e0b; color:#92400e;" class="" >Compare (<span id="cmp-count">0</span>)</button>
  </aside>

  <!-- Topic list -->
  <main id="list-pane">
    <div id="spinner">Loading…</div>
    <div id="topic-list"></div>
  </main>

  <!-- Detail pane -->
  <aside id="detail-pane">
    <button id="detail-close">✕ Close</button>
    <div id="detail-content"></div>
  </aside>
</div>

<!-- Compare modal -->
<div id="compare-pane">
  <div id="compare-inner">
    <div id="compare-header">
      <h2>Side-by-side comparison</h2>
      <button id="compare-close">✕ Close</button>
    </div>
    <div id="compare-body"></div>
  </div>
</div>

<script>
const COMPARE_FIELDS = ["objective","description","phase1Description","phase2Description","phase3Description","keywords","technology_areas","modernization_priorities"];
const COMPARE_LABELS = {"objective":"Objective","description":"Description","phase1Description":"Phase I","phase2Description":"Phase II","phase3Description":"Phase III","keywords":"Keywords","technology_areas":"Tech Areas","modernization_priorities":"Modernization"};

let debounce_t;
let compareSet = {};   // topic_id -> topic row (card data)

// --- Fetch & render list ---
function loadTopics() {
  clearTimeout(debounce_t);
  debounce_t = setTimeout(_load, 250);
}

async function _load() {
  const p = new URLSearchParams({
    q: document.getElementById("q").value,
    component: document.getElementById("filter-component").value,
    status: document.getElementById("filter-status").value,
    program: document.getElementById("filter-program").value,
  });
  document.getElementById("spinner").style.display = "block";
  document.getElementById("topic-list").innerHTML = "";
  const res = await fetch("/api/topics?" + p);
  const topics = await res.json();
  document.getElementById("spinner").style.display = "none";
  document.getElementById("count").textContent = `${topics.length} topics`;
  const list = document.getElementById("topic-list");
  if (!topics.length) { list.innerHTML = '<div class="empty">No topics found.</div>'; return; }
  topics.forEach(t => {
    const inCmp = !!compareSet[t.topic_id];
    const card = document.createElement("div");
    card.className = "topic-card" + (inCmp ? " compare-selected" : "");
    card.dataset.id = t.topic_id;
    card.innerHTML = `
      <div class="card-code">${t.topic_code || ""}</div>
      <div class="card-title">${t.title || "(no title)"}</div>
      <div class="card-meta">${[t.component, t.program, t.status].filter(Boolean).join(" · ")}</div>
      <div class="card-meta">${t.open_date || ""} → ${t.close_date || ""}</div>
      <div class="card-actions">
        <button onclick="openDetail('${t.topic_id}')">View detail</button>
        <button class="cmp-btn" onclick="toggleCompare(event,'${t.topic_id}',${JSON.stringify(t).replace(/"/g,'&quot;')})">
          ${inCmp ? "✓ Added" : "⊕ Compare"}
        </button>
      </div>`;
    list.appendChild(card);
  });
}

// --- Detail ---
async function openDetail(id) {
  const res = await fetch(`/api/topic/${id}`);
  const t = await res.json();
  const pane = document.getElementById("detail-pane");
  pane.classList.add("open");
  document.querySelectorAll(".topic-card").forEach(c => c.classList.toggle("selected", c.dataset.id === id));
  document.getElementById("detail-content").innerHTML = renderDetail(t);
}

function renderDetail(t) {
  const meta = (label, val) => val ? `<div class="meta-item"><label>${label}</label><span>${val}</span></div>` : "";
  const sec = (label, val) => val ? `<div class="section-title">${label}</div><div class="section-body">${val}</div>` : "";
  return `
    <h2>${t.title || "(no title)"}</h2>
    <div class="meta-grid">
      ${meta("Code", t.topic_code)}
      ${meta("Status", t.status)}
      ${meta("Component", t.component)}
      ${meta("Program", t.program)}
      ${meta("Command", t.command)}
      ${meta("Solicitation", t.solicitation)}
      ${meta("Open", t.open_date)}
      ${meta("Close", t.close_date)}
    </div>
    ${sec("Keywords", t.keywords)}
    ${sec("Tech Areas", t.technology_areas)}
    ${sec("Modernization", t.modernization_priorities)}
    ${sec("Objective", t.objective)}
    ${sec("Description", t.description)}
    ${sec("Phase I", t.phase1Description)}
    ${sec("Phase II", t.phase2Description)}
    ${sec("Phase III", t.phase3Description)}
    ${sec("Reference Docs", t.referenceDocuments)}
  `;
}

document.getElementById("detail-close").onclick = () => {
  document.getElementById("detail-pane").classList.remove("open");
  document.querySelectorAll(".topic-card").forEach(c => c.classList.remove("selected"));
};

// --- Compare ---
function toggleCompare(e, id, topic) {
  e.stopPropagation();
  if (compareSet[id]) {
    delete compareSet[id];
  } else {
    if (Object.keys(compareSet).length >= 3) { alert("Max 3 topics for comparison."); return; }
    compareSet[id] = topic;
  }
  updateCompareBtn();
  loadTopics();
}

function updateCompareBtn() {
  const n = Object.keys(compareSet).length;
  const btn = document.getElementById("compare-btn");
  btn.style.display = n > 0 ? "block" : "none";
  document.getElementById("cmp-count").textContent = n;
}

document.getElementById("compare-btn").onclick = async () => {
  const ids = Object.keys(compareSet);
  const topics = await Promise.all(ids.map(id => fetch(`/api/topic/${id}`).then(r => r.json())));
  const body = document.getElementById("compare-body");
  body.innerHTML = topics.map(t => `
    <div class="compare-col">
      <h3>${t.topic_code} — ${t.title || ""}</h3>
      <div class="meta-grid" style="margin-bottom:8px">
        ${[["Component",t.component],["Program",t.program],["Status",t.status],["Open",t.open_date],["Close",t.close_date]]
          .filter(([,v])=>v).map(([l,v])=>`<div class="meta-item"><label>${l}</label><span>${v}</span></div>`).join("")}
      </div>
      ${COMPARE_FIELDS.map(f => t[f] ? `<div class="section-title">${COMPARE_LABELS[f]}</div><div class="section-body">${t[f]}</div>` : "").join("")}
    </div>
  `).join("");
  document.getElementById("compare-pane").classList.add("open");
};

document.getElementById("compare-close").onclick = () => document.getElementById("compare-pane").classList.remove("open");

// --- Filters ---
["q","filter-component","filter-status","filter-program"].forEach(id => {
  document.getElementById(id).addEventListener("input", loadTopics);
});
document.getElementById("clear-btn").onclick = () => {
  ["q","filter-component","filter-status","filter-program"].forEach(id => {
    const el = document.getElementById(id);
    el.value = el.tagName === "SELECT" ? "" : "";
  });
  loadTopics();
};

loadTopics();
</script>
</body>
</html>
