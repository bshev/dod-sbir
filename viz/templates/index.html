<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>DoD SBIR/STTR Topics</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      font-size: 14px;
      background: #f4f5f7;
      color: #1a1a2e;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: .03em;
    }

    #count {
      font-size: 12px;
      color: #aab;
      margin-left: auto;
    }

    .shell {
      display: flex;
      height: calc(100vh - 45px);
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: 210px;
      min-width: 210px;
      background: #fff;
      border-right: 1px solid #dde;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 8px;
      overflow-y: auto;
    }

    #sidebar label {
      font-size: 11px;
      font-weight: 600;
      color: #667;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    #sidebar input,
    #sidebar select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #dde;
      border-radius: 4px;
      font-size: 13px;
      background: #f9f9fb;
    }

    #sidebar input:focus,
    #sidebar select:focus {
      outline: none;
      border-color: #4a7cff;
    }

    #clear-btn {
      margin-top: 4px;
      padding: 6px;
      border: 1px solid #dde;
      border-radius: 4px;
      background: #f4f5f7;
      cursor: pointer;
      font-size: 12px;
    }

    #clear-btn:hover {
      background: #e8e9ec;
    }

    /* Topic list */
    #list-pane {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .topic-card {
      background: #fff;
      border: 1px solid #dde;
      border-radius: 6px;
      padding: 10px 14px;
      cursor: pointer;
      transition: border-color .15s;
    }

    .topic-card:hover {
      border-color: #4a7cff;
    }

    .topic-card.selected {
      border-color: #4a7cff;
      background: #f0f4ff;
    }

    .card-code {
      font-size: 11px;
      font-weight: 700;
      color: #4a7cff;
      letter-spacing: .04em;
    }

    .card-title {
      font-size: 13px;
      font-weight: 500;
      margin: 2px 0;
    }

    .card-meta {
      font-size: 11px;
      color: #778;
    }

    .card-actions {
      margin-top: 6px;
    }

    .card-actions button {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 3px;
      border: 1px solid #dde;
      background: #f4f5f7;
      cursor: pointer;
    }

    .card-actions button:hover {
      background: #e4e5e8;
    }

    /* Detail pane */
    #detail-pane {
      width: 560px;
      min-width: 400px;
      background: #fff;
      border-left: 1px solid #dde;
      overflow-y: auto;
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    #detail-pane.open {
      display: flex;
    }

    #detail-pane h2 {
      font-size: 15px;
      font-weight: 600;
    }

    #detail-pane .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 12px;
    }

    #detail-pane .meta-item label {
      font-size: 10px;
      font-weight: 700;
      color: #667;
      text-transform: uppercase;
      letter-spacing: .05em;
      display: block;
    }

    #detail-pane .meta-item span {
      font-size: 13px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: #667;
      text-transform: uppercase;
      letter-spacing: .05em;
      border-top: 1px solid #eee;
      padding-top: 10px;
    }

    .section-body {
      font-size: 13px;
      line-height: 1.6;
      color: #333;
      white-space: pre-wrap;
    }

    #detail-close {
      align-self: flex-end;
      font-size: 11px;
      padding: 4px 10px;
      border: 1px solid #dde;
      border-radius: 4px;
      background: #f4f5f7;
      cursor: pointer;
    }

    .empty {
      color: #aab;
      font-size: 13px;
      padding: 20px;
      text-align: center;
    }

    #spinner {
      display: none;
      color: #aab;
      font-size: 13px;
      padding: 20px;
      text-align: center;
    }

    /* Score stars */
    .card-score {
      display: inline-flex;
      gap: 2px;
      margin-top: 5px;
    }

    .card-score button {
      background: none;
      border: none;
      padding: 0;
      font-size: 16px;
      cursor: pointer;
      color: #ddd;
      line-height: 1;
    }

    .card-score button.active {
      color: #f59e0b;
    }

    .card-score button:hover,
    .card-score button:hover ~ button {
      color: inherit;
    }

    .card-score:hover button {
      color: #f59e0b;
    }

    .card-score button:hover ~ button {
      color: #ddd;
    }

    /* Detail score row */
    .detail-score {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .detail-score label {
      font-size: 10px;
      font-weight: 700;
      color: #667;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .detail-score .stars button {
      background: none;
      border: none;
      padding: 0;
      font-size: 20px;
      cursor: pointer;
      color: #ddd;
      line-height: 1;
    }

    .detail-score .stars button.active {
      color: #f59e0b;
    }

    .detail-score .stars:hover button {
      color: #f59e0b;
    }

    .detail-score .stars button:hover ~ button {
      color: #ddd;
    }

    .clear-score {
      font-size: 11px;
      color: #aab;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .clear-score:hover {
      color: #667;
    }
  </style>
</head>

<body>

  <header>
    <h1>DoD SBIR/STTR Open Topics</h1>
    <span id="count"></span>
  </header>

  <div class="shell">
    <!-- Sidebar filters -->
    <aside id="sidebar">
      <label>Search</label>
      <input id="q" type="search" placeholder="code, title, keyword…">

      <label>Program</label>
      <select id="filter-program">
        <option value="">All</option>
        {% for p in filters.programs %}<option value="{{ p }}">{{ p }}</option>{% endfor %}
      </select>

      <label>Min score</label>
      <select id="filter-score">
        <option value="">All (incl. no score)</option>
        <option value="1">★ 1+</option>
        <option value="2">★★ 2+</option>
        <option value="3">★★★ 3+</option>
        <option value="4">★★★★ 4+</option>
        <option value="5">★★★★★ 5 only</option>
      </select>

      <label>Sort by</label>
      <select id="sort-col">
        <option value="topic_code">Topic Code</option>
        <option value="title">Title</option>
        <option value="component">Component</option>
        <option value="program">Program</option>
        <option value="status">Status</option>
        <option value="close_date">Close Date</option>
        <option value="open_date">Open Date</option>
        <option value="score">Score</option>
      </select>
      <select id="sort-dir">
        <option value="asc">Ascending</option>
        <option value="desc">Descending</option>
      </select>

      <button id="clear-btn">Clear filters</button>
    </aside>

    <!-- Topic list -->
    <main id="list-pane">
      <div id="spinner">Loading…</div>
      <div id="topic-list"></div>
    </main>

    <!-- Detail pane -->
    <aside id="detail-pane">
      <button id="detail-close">✕ Close</button>
      <div id="detail-content"></div>
    </aside>
  </div>

  <script>
    let debounce_t;
    let allTopics = [];

    function sortTopics(topics) {
      const col = document.getElementById("sort-col").value;
      const dir = document.getElementById("sort-dir").value === "asc" ? 1 : -1;
      return [...topics].sort((a, b) => {
        const av = (a[col] || "").toString().toLowerCase();
        const bv = (b[col] || "").toString().toLowerCase();
        return av < bv ? -dir : av > bv ? dir : 0;
      });
    }

    function renderList(topics) {
      const list = document.getElementById("topic-list");
      list.innerHTML = "";
      if (!topics.length) { list.innerHTML = '<div class="empty">No topics found.</div>'; return; }
      topics.forEach(t => {
        const card = document.createElement("div");
        card.className = "topic-card";
        card.dataset.id = t.topic_id;
        card.innerHTML = `
          <div class="card-code">${t.topic_code || ""}</div>
          <div class="card-title">${t.title || "(no title)"}</div>
          <div class="card-meta">${[t.component, t.program].filter(Boolean).join(" · ")}</div>
          <div class="card-meta">${t.open_date || ""} → ${t.close_date || ""}</div>
          <div class="card-score">${starsHtml(t.topic_id, t.score, true)}</div>
          <div class="card-actions">
            <button onclick="openDetail('${t.topic_id}')">View detail</button>
          </div>`;
        list.appendChild(card);
      });
    }

    function loadTopics() {
      clearTimeout(debounce_t);
      debounce_t = setTimeout(_load, 250);
    }

    async function _load() {
      const p = new URLSearchParams({
        q: document.getElementById("q").value,
        program: document.getElementById("filter-program").value,
        phase1_configured: document.getElementById("filter-phase1")?.value ?? "",
        min_score: document.getElementById("filter-score").value,
      });
      document.getElementById("spinner").style.display = "block";
      document.getElementById("topic-list").innerHTML = "";
      const res = await fetch("/api/topics?" + p);
      allTopics = await res.json();
      document.getElementById("spinner").style.display = "none";
      document.getElementById("count").textContent = `${allTopics.length} topics`;
      renderList(sortTopics(allTopics));
    }

    // --- Score ---
    function starsHtml(id, score, small) {
      return [1,2,3,4,5].map(n =>
        `<button class="${score >= n ? 'active' : ''}" onclick="saveScore(event,'${id}',${n})" title="${n}">★</button>`
      ).join("");
    }

    async function saveScore(e, id, val) {
      e.stopPropagation();
      const current = allTopics.find(t => t.topic_id === id)?.score;
      const newScore = current === val ? null : val;
      await fetch(`/api/topic/${id}/score`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({score: newScore}),
      });
      // update local cache so re-renders reflect the change without a full reload
      allTopics = allTopics.map(t => t.topic_id === id ? {...t, score: newScore} : t);
      // re-render stars on the card
      const card = document.querySelector(`.topic-card[data-id="${id}"] .card-score`);
      if (card) card.innerHTML = starsHtml(id, newScore, true);
      // re-render stars in detail if open
      const detailStars = document.querySelector("#detail-score-stars");
      if (detailStars && detailStars.dataset.id === id) detailStars.innerHTML = starsHtml(id, newScore, false);
    }

    // --- Detail ---
    async function openDetail(id) {
      const res = await fetch(`/api/topic/${id}`);
      const t = await res.json();
      const pane = document.getElementById("detail-pane");
      pane.classList.add("open");
      document.querySelectorAll(".topic-card").forEach(c => c.classList.toggle("selected", c.dataset.id === id));
      document.getElementById("detail-content").innerHTML = renderDetail(t);
    }

    function renderDetail(t) {
      const meta = (label, val) => val ? `<div class="meta-item"><label>${label}</label><span>${val}</span></div>` : "";
      const sec = (label, val) => val ? `<div class="section-title">${label}</div><div class="section-body">${val}</div>` : "";
      return `
        <h2>${t.title || "(no title)"}</h2>
        <div class="detail-score">
          <label>Score</label>
          <div class="stars" id="detail-score-stars" data-id="${t.topic_id}">${starsHtml(t.topic_id, t.score, false)}</div>
        </div>
        <div class="meta-grid">
          ${meta("Code", t.topic_code)}
          ${meta("Component", t.component)}
          ${meta("Program", t.program)}
          ${meta("Command", t.command)}
          ${meta("Open", t.open_date)}
          ${meta("Close", t.close_date)}
          <div class="meta-item"><label>Phase I</label><span>${t.phase1_configured ?? "—"}</span></div>
          <div class="meta-item"><label>Phase II</label><span>${t.phase2_configured ?? "—"}</span></div>
        </div>
        ${sec("Keywords", t.keywords)}
        ${sec("Tech Areas", t.technology_areas)}
        ${sec("Modernization", t.modernization_priorities)}
        ${sec("Objective", t.objective)}
        ${sec("Description", t.description)}
        ${sec("Phase I Description", t.phase1_description)}
        ${sec("Phase II Description", t.phase2_description)}
        ${sec("Phase III Description", t.phase3_description)}

        ${sec("Reference Docs", t.referenceDocuments)}
      `;
    }

    document.getElementById("detail-close").onclick = () => {
      document.getElementById("detail-pane").classList.remove("open");
      document.querySelectorAll(".topic-card").forEach(c => c.classList.remove("selected"));
    };

    // --- Filters & sort ---
    ["q", "filter-program", "filter-score"].forEach(id => {
      document.getElementById(id).addEventListener("input", loadTopics);
    });

    ["sort-col", "sort-dir"].forEach(id => {
      document.getElementById(id).addEventListener("change", () => renderList(sortTopics(allTopics)));
    });

    document.getElementById("clear-btn").onclick = () => {
      ["q", "filter-program", "filter-score"].forEach(id => {
        document.getElementById(id).value = "";
      });
      loadTopics();
    };

    loadTopics();
  </script>
</body>

</html>
